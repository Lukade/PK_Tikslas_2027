<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EEF2FF; --surface:#FFFFFF; --ink:#1A1D3A; --muted:#62668A; --line:#D9DEF5;
  --track:#DCE2FA; --sun:#FFC93C; --focus:#5B6CFF;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11132A; --surface:#1B1E3D; --ink:#EEF0FF; --muted:#A3A7CC; --line:#2C3060;
    --track:#262A52; --sun:#FFD25E; --focus:#8E9BFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11132A; --surface:#1B1E3D; --ink:#EEF0FF; --muted:#A3A7CC; --line:#2C3060;
  --track:#262A52; --sun:#FFD25E; --focus:#8E9BFF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
img{max-width:100%}

.wrap{max-width:880px;margin:0 auto;padding:40px 20px 64px}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font:800 clamp(40px,8vw,68px)/.95 var(--display);letter-spacing:-.03em;margin:0}

/* goal meter */
.meter{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px 20px 16px;margin-bottom:28px}
.meter-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.meter-count{font:800 44px/1 var(--display);letter-spacing:-.02em}
.meter-count small{font:600 18px var(--display);color:var(--muted);letter-spacing:0;margin-left:4px}
.meter-note{font-size:15px;color:var(--muted);text-align:right}
.bar{position:relative;height:34px;border-radius:17px;background:var(--track);overflow:hidden;display:flex}
.seg{height:100%;transition:width .5s cubic-bezier(.3,1.3,.5,1);border-right:2px solid var(--surface)}
.seg:last-child{border-right:0}
.ticks{position:absolute;inset:0;display:flex;pointer-events:none}
.ticks span{flex:1;border-right:2px dashed color-mix(in srgb,var(--surface) 55%,transparent)}
.ticks span:last-child{border-right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.meter.done{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 35%,transparent)}

/* board */
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:44px 48px minmax(90px,170px) 1fr auto;align-items:center;gap:14px;
  background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;border-left:8px solid var(--c)}
.rank{font:800 26px/1 var(--display);color:var(--muted);text-align:center}
.row.top .rank{color:var(--ink)}
.medal{font-size:26px;line-height:1}
.face{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:28px;overflow:hidden;
  background:color-mix(in srgb,var(--c) 18%,var(--surface));border:3px solid var(--c)}
.face img{width:100%;height:100%;object-fit:cover}
.name{font:700 20px/1.2 var(--display);overflow-wrap:anywhere;margin:0}
.trail{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:26px}
.tok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:15px;overflow:hidden;
  background:color-mix(in srgb,var(--c) 14%,var(--surface));box-shadow:0 0 0 2px var(--c)}
.tok img{width:100%;height:100%;object-fit:cover}
.pts{display:flex;align-items:center;gap:8px}
.score{font:800 34px/1 var(--display);min-width:2ch;text-align:right;letter-spacing:-.02em}
.score small{display:block;font:500 12px var(--body);color:var(--muted);text-align:right;letter-spacing:0}

.empty{padding:36px 20px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:18px}

@media (max-width:640px){
  .wrap{padding:28px 14px 48px}
  .row{grid-template-columns:34px 44px 1fr auto;gap:10px;padding:12px}
  .face{width:44px;height:44px}
  .trail{grid-column:2/-1;grid-row:2}
  .rank{font-size:22px}
  .score{font-size:28px}
}
@media (prefers-reduced-motion: reduce){.seg{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="state">{"title":"Leaderboard","goal":100,"players":[{"id":"p1","name":"Player One","avatar":{"type":"emoji","value":"🦊"},"color":"#FF7A45","points":12},{"id":"p2","name":"Player Two","avatar":{"type":"emoji","value":"🐸"},"color":"#22B8A0","points":9},{"id":"p3","name":"Player Three","avatar":{"type":"emoji","value":"🐧"},"color":"#5B6CFF","points":7},{"id":"p4","name":"Player Four","avatar":{"type":"emoji","value":"🐱"},"color":"#FF5C93","points":4}]}</script>
<script id="app">
(function(){
  const MEDALS=["🥇","🥈","🥉"];
  const TRAIL_CAP=300;
  const state=JSON.parse(document.getElementById("state").textContent);
  const $=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};

  function avatarNode(a,cls){
    const n=$("span",cls);
    if(a&&a.type==="img"){const i=new Image();i.alt="";i.src=a.value;n.append(i);}
    else n.textContent=(a&&a.value)||"⭐";
    return n;
  }

  function render(){
    document.title=state.title||"Leaderboard";
    const root=document.getElementById("root");
    root.replaceChildren();
    const wrap=$("main","wrap");

    // header
    const head=$("div","head");
    head.append($("h1",null,state.title||"Leaderboard"));

    // meter
    const players=Array.isArray(state.players)?state.players:[];
    const total=players.reduce((s,p)=>s+Math.max(0,p.points),0);
    const goal=Math.max(1,state.goal||100);
    const meter=$("section","meter"+(total>=goal?" done":""));
    meter.setAttribute("aria-label","Team goal");
    const top=$("div","meter-top");
    const count=$("div","meter-count",String(total));
    const sm=$("small");sm.textContent="/ "+goal;count.append(sm);
    const note=$("div","meter-note",total>=goal?"Goal reached! 🎉":(goal-total)+" points to go");
    top.append(count,note);
    const bar=$("div","bar");
    bar.setAttribute("role","progressbar");bar.setAttribute("aria-valuemin","0");
    bar.setAttribute("aria-valuemax",String(goal));bar.setAttribute("aria-valuenow",String(Math.min(total,goal)));
    const scale=Math.max(total,goal);
    [...players].sort((a,b)=>b.points-a.points).forEach(p=>{
      if(p.points<=0)return;
      const s=$("div","seg");s.style.width=(p.points/scale*100)+"%";s.style.background=p.color;s.title=p.name+": "+p.points;
      bar.append(s);
    });
    const ticks=$("div","ticks");for(let i=0;i<10;i++)ticks.append($("span"));bar.append(ticks);
    const legend=$("div","legend");
    players.forEach(p=>{const d=$("span");const i=$("i");i.style.background=p.color;d.append(i,document.createTextNode(p.name+" "+p.points));legend.append(d);});
    meter.append(top,bar,legend);

    // board
    const list=$("ol","board");
    const sorted=[...players].sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name));
    let rank=0,prev=null;
    sorted.forEach((p,i)=>{
      if(p.points!==prev){rank=i+1;prev=p.points;}
      const li=$("li","row"+(rank<=3&&p.points>0?" top":""));li.style.setProperty("--c",p.color);
      const r=$("div","rank");
      if(rank<=3&&p.points>0){const m=$("span","medal",MEDALS[rank-1]);m.setAttribute("aria-label","Rank "+rank);r.append(m);}
      else r.textContent=rank;
      const face=avatarNode(p.avatar,"face");
      const nm=$("p","name",p.name);
      const trail=$("div","trail");trail.setAttribute("aria-label",p.points+" points");
      const shown=Math.max(0,Math.min(p.points,TRAIL_CAP));
      for(let k=0;k<shown;k++)trail.append(avatarNode(p.avatar,"tok"));
      const pts=$("div","pts");
      const sc=$("div","score",String(p.points));sc.append($("small",null,p.points===1?"point":"points"));
      pts.append(sc);
      li.append(r,face,nm,trail,pts);
      list.append(li);
    });

    wrap.append(head,meter);
    wrap.append(players.length?list:$("div","empty","No players yet."));
    root.append(wrap);
  }

  render();
})();
</script>
</body>
</html>
